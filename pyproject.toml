[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blackwing-ai"
version = "0.1.0"
description = "BlackWing AI runway-incursion investigation prototype"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["blackwing*"]

[tool.setuptools.package-data]
"blackwing" = ["agents/*/prompt.md", "agents/report/*.md", "gold_catalog.json"]
"blackwing.rag" = ["seed/*.json"]
