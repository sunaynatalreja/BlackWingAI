ue="2000">Fast</option></select> <button onclick="document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()">Full screen</button></footer><script>
const N=[['Investigator',20,30],['Streamlit UI',240,30],['FastAPI',460,30],['SQLite',900,30],['RAG retrieval',460,125],['Aviation KB / index',240,125],['LangGraph planner',680,125],['Investigation',20,240],['Similar cases',240,240],['Compliance',460,240],['Risk',680,240],['Mitigation',900,240],['Critic',460,340],['Report generator',680,340],['Human review',900,340]];const S=[[0,1,'Investigator enters incident narrative, metadata and optional evidence.'],[1,2,'Streamlit submits the investigation request to FastAPI.'],[2,3,'FastAPI creates the case and analysis run in SQLite.'],[2,4,'Backend requests relevant aviation knowledge.'],[4,5,'RAG searches the approved knowledge base and saved index.'],[5,4,'Retrieved passages return with source references. Historical cases are context, not proof.'],[4,6,'Retrieved passages and case evidence inform the LangGraph workflow.'],[6,7,'Investigation identifies documented facts, observations and evidence gaps.'],[6,8,'Similar Case Analysis compares historical incidents with attribution.'],[6,9,'Compliance examines potentially applicable rules and procedures.'],[6,10,'Risk provides a provisional assessment when evidence is sufficient.'],[6,11,'Mitigation proposes actions linked to identified hazards.'],[7,12,'Critic reviews investigation outputs and evidence support.'],[8,12,'Historical comparisons are reviewed.'],[9,12,'Compliance findings are reviewed.'],[10,12,'Risk findings are reviewed.'],[11,12,'Mitigation proposals are reviewed.'],[12,13,'Reviewed findings are assembled into a draft report.'],[13,3,'Report and run information are persisted.'],[13,2,'Report generator returns the structured investigation report to FastAPI.'],[2,1,'FastAPI returns the report and run status to Streamlit through the API response or a subsequent report fetch.'],[1,0,'Streamlit renders the investigation findings, compliance, risk, mitigation and source references for the investigator.'],[0,14,'The investigator reviews the displayed draft and makes t
