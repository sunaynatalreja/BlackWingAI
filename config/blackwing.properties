# Configuration values are resolved from the process environment.
# Set BLACKWING_CONFIG to this file's path before starting the app.
app.host=${BLACKWING_API_HOST}
app.port=${BLACKWING_API_PORT}
llm.provider=${BLACKWING_LLM_PROVIDER:-openai_compatible}
api.base_url=${BLACKWING_LLM_API_BASE_URL}
api.model=${BLACKWING_LLM_API_MODEL:-Qwen/Qwen3-8B}
api.key=${BLACKWING_LLM_API_KEY}
api.ca_cert=${BLACKWING_LLM_CA_CERT}
api.timeout_seconds=${BLACKWING_LLM_API_TIMEOUT_SECONDS}
api.temperature=${BLACKWING_LLM_API_TEMPERATURE}
api.max_output_tokens=${BLACKWING_LLM_API_MAX_OUTPUT_TOKENS:-1024}
agents.token_quota.default=${BLACKWING_AGENT_TOKEN_QUOTA_DEFAULT:-768}
agents.token_quota.investigation=${BLACKWING_AGENT_TOKEN_QUOTA_INVESTIGATION:-768}
agents.token_quota.similar_case=${BLACKWING_AGENT_TOKEN_QUOTA_SIMILAR_CASE:-512}
agents.token_quota.compliance=${BLACKWING_AGENT_TOKEN_QUOTA_COMPLIANCE:-768}
agents.token_quota.risk=${BLACKWING_AGENT_TOKEN_QUOTA_RISK:-768}
agents.token_quota.mitigation=${BLACKWING_AGENT_TOKEN_QUOTA_MITIGATION:-512}
agents.token_quota.critic=${BLACKWING_AGENT_TOKEN_QUOTA_CRITIC:-512}
agents.token_quota.verification=${BLACKWING_AGENT_TOKEN_QUOTA_VERIFICATION:-512}
agents.token_quota.report=${BLACKWING_AGENT_TOKEN_QUOTA_REPORT:-768}
agents.token_quota.report_planner=${BLACKWING_AGENT_TOKEN_QUOTA_REPORT_PLANNER:-256}
agents.token_quota.report_section=${BLACKWING_AGENT_TOKEN_QUOTA_REPORT_SECTION:-768}
api.json_response_format=${BLACKWING_API_JSON_RESPONSE_FORMAT:-false}
api.min_interval_seconds=${BLACKWING_IIT_MIN_INTERVAL_SECONDS:-1.1}
llm.tokenizer_model=${BLACKWING_QWEN_TOKENIZER:-Qwen/Qwen3-8B}
ui.api_url=${BLACKWING_UI_API_URL}
ui.request_timeout_seconds=${BLACKWING_UI_TIMEOUT_SECONDS}
rag.backend=${BLACKWING_RAG_BACKEND:-iit}
rag.embedding_model=${BLACKWING_EMBEDDING_MODEL:-bge-small-en-v1.5}
rag.embedding_url=${BLACKWING_EMBEDDING_URL}
rag.embedding_api_key=${BLACKWING_EMBEDDING_API_KEY}
rag.embedding_ca_cert=${BLACKWING_EMBEDDING_CA_CERT}
rag.embedding_timeout_seconds=${BLACKWING_EMBEDDING_TIMEOUT:-60}
rag.embedding_retries=${BLACKWING_EMBEDDING_RETRIES:-2}
rag.cache_path=${BLACKWING_RAG_CACHE:-rag_cache/embeddings_iit.sqlite}
rag.index_dir=${BLACKWING_RAG_INDEX_DIR:-}
logging.model_response_log_limit=${BLACKWING_MODEL_RESPONSE_LOG_LIMIT:-4000}
